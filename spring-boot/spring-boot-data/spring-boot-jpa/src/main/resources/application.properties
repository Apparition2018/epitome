spring.application.name=spring-boot-jpa
spring.config.import=optional:classpath:application-db.properties

spring.sql.init.schema-locations=classpath:db/world-db/world-schema.sql,classpath:db/demo/demo-schema.sql
spring.sql.init.data-locations=classpath:db/world-db/world-data.sql

# ==================== JPA + Hibernate ====================
# 关闭自动建表：表结构由 schema SQL 负责，Hibernate 仅做映射
spring.jpa.hibernate.ddl-auto=none
# 打印 SQL 便于观察
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# 数据库方言：显式指定 H2 方言（不写时 Hibernate 自动探测）
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 用 @Column(name=...) 精确匹配列名，而不是驼峰转下划线
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# 关闭 Open Session/EntityManager in View（OSIV）
# 作用：默认开启时，JPA EntityManager 会在整个 HTTP 请求（包括视图渲染）期间保持打开，
# 允许在 Controller/View 层进行懒加载。但这也意味着数据库连接被长时间占用，且容易
# 在视图层意外触发 N+1 查询，导致性能问题。
# 关闭后，EntityManager 会在 @Transactional 方法结束时关闭。视图层若需关联数据，
# 必须在 Service 层通过 JOIN FETCH、实体图（@EntityGraph）或显式查询来提前加载。
# 推荐：生产环境建议关闭，配合 @Transactional 明确事务边界，提升性能与可维护性。
spring.jpa.open-in-view=false

# ==================== 序号 6：实体二级缓存（JPA 规范层） ====================
# shared-cache-mode=ENABLE_SELECTIVE：仅缓存显式标注了 @Cacheable 的实体（Customer3）
# （规范层开关，对应参考 persistence.xml 的 <shared-cache-mode>ENABLE_SELECTIVE</shared-cache-mode>）
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE
# 真正缓存存储仍由实现层（Hibernate）承载，以下两条是让二级缓存生效的底层配置
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.internal.JCacheRegionFactory
# 开启统计，供测试用 Hibernate Statistics 验证二级缓存命中（仅演示，生产建议关闭）
spring.jpa.properties.hibernate.generate_statistics=true
