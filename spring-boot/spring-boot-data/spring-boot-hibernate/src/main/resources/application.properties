spring.application.name=spring-boot-hibernate

# ==================== 数据源：H2 内存数据库 ====================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# ==================== Schema / 数据初始化 ====================
# 复用 commons 模块中的 world 数据库（city / country / countrylanguage 三表）
# 再追加 demo-schema.sql 建演示用表：product（乐观锁/@DynamicUpdate）、person（继承+@Embeddable）、
# teacher/student/teacher_student（多对多）、author/passport（一对一）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/world-db/world-schema.sql,classpath:db/demo/demo-schema.sql
spring.sql.init.data-locations=classpath:db/world-db/world-data.sql

# ==================== JPA + Hibernate ====================
# 关闭自动建表：表结构完全由上面两个 schema SQL 负责，Hibernate 仅做映射
spring.jpa.hibernate.ddl-auto=none
# 打印 SQL 及绑定参数，便于观察脏检查 / 缓存命中
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# 数据库方言：显式指定 H2 方言（不写时 Hibernate 自动探测）
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 直接用 @Column(name=...) 去匹配表列名，而不是驼峰转下划线
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==================== 二级缓存 ====================
# 使用 Hibernate 内置的本地二级缓存（in-memory），演示 @Cache + @NaturalIdCache
# （生产一般接 Redis / EHCache，这里保持轻量、无额外依赖）
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.internal.JCacheRegionFactory
# 开启查询缓存：同一 HQL/条件查询的结果集（主键集合）会被缓存，
# 需配合二级缓存使用，且要显式调用 query.setCacheable(true) 才会缓存。
# 底层用"时间戳缓存区域"判定结果是否失效（依赖表发生更新即整体作废）。
spring.jpa.properties.hibernate.cache.use_query_cache=true
# 开启 Hibernate 统计，供测试中验证二级缓存 / 查询缓存命中情况（仅演示，生产建议关闭）
spring.jpa.properties.hibernate.generate_statistics=true
