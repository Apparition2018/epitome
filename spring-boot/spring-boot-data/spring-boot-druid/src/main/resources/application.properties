spring.application.name=spring-boot-druid
spring.config.import=optional:classpath:application-db.properties

spring.sql.init.schema-locations=classpath:db/world-db/world-schema.sql
spring.sql.init.data-locations=classpath:db/world-db/world-data.sql

# ==================== Druid 连接池核心参数 ====================
# RuoYi 动态数据源 (DataSourceAspect)：http://doc.ruoyi.vip/ruoyi/document/htsc.html#%E5%A4%9A%E6%95%B0%E6%8D%AE%E6%BA%90
# 显式指定数据源类型为 Druid（默认即 Druid，此处点明）
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
# 初始连接数
spring.datasource.druid.initial-size=5
# 最小空闲连接数
spring.datasource.druid.min-idle=5
# 最大活动连接数
spring.datasource.druid.max-active=20
# 获取连接时的最大等待时间（毫秒），超时抛异常
spring.datasource.druid.max-wait=60000
# 间隔多久才进行一次检测，检测需要关闭的空闲连接（毫秒）
spring.datasource.druid.time-between-eviction-runs-millis=60000
# 一个连接在池中最小生存的时间（毫秒）
spring.datasource.druid.min-evictable-idle-time-millis=300000
# 申请连接时执行 validationQuery 校验连接是否有效
spring.datasource.druid.test-on-borrow=true
# 归还连接时执行 validationQuery 校验连接是否有效
spring.datasource.druid.test-on-return=false
# 申请连接的时候检测，如果空闲时间大于 time-between-eviction-runs-millis，
# 执行 validationQuery 校验连接是否有效（做空闲检测）
spring.datasource.druid.test-while-idle=true
# 检测连接是否有效的 SQL
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.validation-query-timeout=3000
# 是否缓存 preparedStatement（PSCache），MySQL 建议开启
spring.datasource.druid.pool-prepared-statements=true
# PSCache 大小
spring.datasource.druid.max-pool-prepared-statement-per-connection-size=20
# 配置监控统计拦截的 filters：stat（统计）、wall（防御 SQL 注入）
spring.datasource.druid.filters=stat,wall,log4j
# 开启 mergeSql 功能（把多条相似 SQL 合并成一条，便于统计慢 SQL 占比）
spring.datasource.druid.connection-properties=druid.stat.mergeSql=true
# 慢 SQL 阈值（毫秒），超过后 DruidStatFilter 会打印慢 SQL 日志
spring.datasource.druid.filter.stat.slow-sql-millis=1000
# 是否记录慢 SQL
spring.datasource.druid.filter.stat.log-slow-sql=true

# ==================== Druid 监控 Web 台（StatViewServlet） ====================
# 启用监控页面
spring.datasource.druid.stat-view-servlet.enabled=true
# 监控台访问路径
spring.datasource.druid.stat-view-servlet.url-pattern=/druid/*
# 监控台登录用户名
spring.datasource.druid.stat-view-servlet.login-username=druid
# 监控台登录密码
spring.datasource.druid.stat-view-servlet.login-password=druid123
# 是否允许重置监控统计
spring.datasource.druid.stat-view-servlet.reset-enable=false

# ==================== Web 应用监控（WebStatFilter） ====================
# 启用 Web 应用监控
spring.datasource.druid.web-stat-filter.enabled=true
# 拦截的 URL
spring.datasource.druid.web-stat-filter.url-pattern=/*
# 排除监控统计的 URL（静态资源、监控台本身等）
spring.datasource.druid.web-stat-filter.exclusions=/druid/*,*.js,*.gif,*.jpg,*.png,*.css,*.ico
# 开启 session 统计
spring.datasource.druid.web-stat-filter.session-stat-enable=true
# 单个 session 最大 URL 统计条数
spring.datasource.druid.web-stat-filter.profile-enable=true
