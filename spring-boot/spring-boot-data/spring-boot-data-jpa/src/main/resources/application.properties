spring.application.name=spring-boot-jpa

# ==================== 数据源：H2 内存数据库 ====================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# ==================== Schema / 数据初始化 ====================
# 复用 commons 模块中的 world 数据库（city / country / countrylanguage 三表）
# 再追加 demo-schema.sql 单独建一张演示乐观锁与审计的 product 表
# （world 三表不建 product，保证严格复用 world 表结构）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/world-db/world-schema.sql,classpath:db/demo/demo-schema.sql
spring.sql.init.data-locations=classpath:db/world-db/world-data.sql

# ==================== JPA / Hibernate ====================
# 关闭自动建表：表结构完全由上面两个 schema SQL 负责，Hibernate 仅做映射
spring.jpa.hibernate.ddl-auto=none
# 打印 SQL 及绑定参数，便于学习
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# 数据库方言：由 Hibernate 自动探测
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 使用标准物理命名策略：严格按 @Column(name=...) 里的列名（保留 world 表的大小写），
# 而不是 Spring 默认的下划线转换（会把 GovernmentForm 变成 government_form）
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
