spring.application.name=spring-boot-starter

# ==================== 多数据源：HikariCP + H2 ====================
# 主数据源（primary）：独立的内存库，连接池上限 5
app.datasource.primary.url=jdbc:h2:mem:primary;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.primary.username=sa
app.datasource.primary.password=
app.datasource.primary.configuration.maximum-pool-size=5

# 从数据源（secondary）：另一个独立的内存库，两库完全隔离
app.datasource.secondary.url=jdbc:h2:mem:secondary;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.secondary.username=sa
app.datasource.secondary.password=
app.datasource.secondary.configuration.maximum-pool-size=5
